services:
  ds2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepseek-web2api:local
    container_name: ds2api
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
    volumes:
      - ds2api-data:/app/data
    restart: unless-stopped

volumes:
  ds2api-data:
